<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f5f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>내 플래너</title>
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --ink: #222; --sub: #8a8a85; --line: #ebeae4;
    --g: #34c759; --y: #ffbf00; --r: #ff4d42; --none: #cfcfc8; --accent: #2f7d5b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  body { padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #app { max-width: 560px; margin: 0 auto; padding: 14px 14px 80px; }
  .hidden { display: none !important; }

  /* 로그인 */
  #login { text-align: center; padding: 18vh 24px 0; }
  #login h1 { font-size: 26px; margin: 0 0 8px; }
  #login p { color: var(--sub); margin: 0 0 28px; }
  .btn-main { background: var(--accent); color: #fff; border: 0; border-radius: 14px;
    padding: 14px 22px; font-size: 16px; font-weight: 600; }
  #loginErr { color: var(--r); font-size: 13px; margin-top: 14px; white-space: pre-wrap; }

  /* 입력창 */
  #addBar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 10px; }
  #addBar input { width: 100%; font-size: 17px; padding: 15px 16px; border: 2px solid var(--line);
    border-radius: 16px; background: var(--card); outline: none; }
  #addBar input:focus { border-color: var(--accent); }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 4px 0; }

  /* 진행도 */
  #progress { margin: 6px 2px 10px; }
  #progress .txt { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  #bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: var(--g); border-radius: 99px;
    transition: width .45s cubic-bezier(.3,1.4,.5,1); }

  /* 필터 */
  #filters { display: flex; gap: 6px; margin: 4px 0 12px; overflow-x: auto; }
  .chip { flex: none; border: 1.5px solid var(--line); background: var(--card); border-radius: 99px;
    padding: 7px 12px; font-size: 13px; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* 구획 */
  .sec { background: var(--card); border-radius: 18px; padding: 10px 6px 6px; margin-bottom: 12px;
    box-shadow: 0 1px 0 rgba(0,0,0,.03); }
  .sec h2 { font-size: 14px; margin: 2px 10px 6px; display: flex; justify-content: space-between; }
  .sec h2 span { color: var(--sub); font-weight: 400; }
  .empty { color: var(--sub); font-size: 13px; padding: 6px 10px 10px; }

  .task { display: flex; align-items: center; gap: 10px; padding: 9px 8px; border-radius: 12px; }
  .task + .task { border-top: 1px solid var(--line); }
  .check { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid var(--none);
    background: #fff; display: grid; place-items: center; padding: 0; font-size: 16px; color: #fff;
    transition: background .15s, border-color .15s, transform .15s; }
  .task.done .check { background: var(--g); border-color: var(--g); transform: scale(1.0); }
  .task.pop .check { animation: pop .38s ease; }
  @keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.3); } 100% { transform: scale(1); } }
  .title { flex: 1; font-size: 16px; line-height: 1.35; word-break: break-word; position: relative; }
  .task.done .title { color: var(--sub); }
  .task.done .title::after { content: ""; position: absolute; left: 0; top: 52%; height: 2px; background: var(--sub);
    width: 100%; animation: strike .3s ease; transform-origin: left; }
  @keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--none); padding: 0; }
  .dot.e1 { background: var(--g); } .dot.e2 { background: var(--y); } .dot.e3 { background: var(--r); }
  .more { flex: none; border: 0; background: transparent; font-size: 20px; color: var(--sub); padding: 2px 6px; }

  /* 시트 */
  #scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 20; }
  #sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto; }
  #sheet .t { font-size: 14px; color: var(--sub); margin: 0 6px 8px; }
  #sheet button { display: block; width: 100%; text-align: left; border: 0; background: transparent;
    font-size: 17px; padding: 13px 8px; border-radius: 10px; }
  #sheet button:active { background: var(--bg); }
  #sheet .danger { color: var(--r); }

  #foot { text-align: center; margin-top: 18px; font-size: 12px; color: var(--sub); }
  #foot button { border: 0; background: none; color: var(--sub); text-decoration: underline; font-size: 12px; }
  #conf { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
</style>
</head>
<body>
<canvas id="conf"></canvas>

<div id="app">
  <section id="login" class="hidden">
    <h1>내 플래너</h1>
    <p>떠오르는 대로 적고, 아침·점심·저녁에 나눠 담기</p>
    <button class="btn-main" id="loginBtn">Google로 시작하기</button>
    <div id="loginErr"></div>
  </section>

  <section id="main" class="hidden">
    <div id="addBar">
      <input id="addInput" type="text" enterkeyhint="done" autocomplete="off"
             placeholder="떠오르는 거 바로 적기…">
      <div class="hint">끝에 /1 /2 /3 을 붙이면 🟢짧게 🟡중간 🔴몰입 (나중에 동그라미를 눌러도 바뀜)</div>
    </div>

    <div id="progress">
      <div class="txt" id="progTxt"></div>
      <div id="bar"><i></i></div>
    </div>

    <div id="filters">
      <button class="chip on" data-f="0">전체</button>
      <button class="chip" data-f="1">🟢 짧게</button>
      <button class="chip" data-f="2">🟡 중간</button>
      <button class="chip" data-f="3">🔴 몰입</button>
    </div>

    <div id="lists"></div>

    <div id="foot"><span id="who"></span> · <button id="logoutBtn">로그아웃</button></div>
  </section>
</div>

<div id="scrim" class="hidden"></div>
<div id="sheet" class="hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB76QKgLn_giZbtGU4NUbSv65XQr5JAUaQ",
  authDomain: "sumins-planner.firebaseapp.com",
  projectId: "sumins-planner",
  storageBucket: "sumins-planner.firebasestorage.app",
  messagingSenderId: "593289365941",
  appId: "1:593289365941:web:2eab9b32dbf15585eb31fc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = initializeFirestore(app, {
  localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
});

const BLOCKS = [
  { id: "inbox",   label: "📥 Inbox (아직 안 정함)" },
  { id: "morning", label: "🌅 아침" },
  { id: "noon",    label: "☀️ 점심" },
  { id: "evening", label: "🌙 저녁" },
];
const $ = (s) => document.querySelector(s);

let uid = null, tasks = [], filter = 0, unsub = null, sheetTask = null;

/* ---------- 로그인 ---------- */
$("#loginBtn").onclick = async () => {
  $("#loginErr").textContent = "";
  const provider = new GoogleAuthProvider();
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await signInWithRedirect(auth, provider); return; } catch (e2) { e = e2; }
    }
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    $("#loginErr").textContent = "로그인 실패: " + (e.code || e.message) +
      (e.code === "auth/unauthorized-domain"
        ? "\nFirebase → Authentication → 설정 → 승인된 도메인에 이 사이트 주소를 추가해 주세요." : "");
  }
};
$("#logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
  if (unsub) { unsub(); unsub = null; }
  if (!user) {
    uid = null; tasks = [];
    $("#main").classList.add("hidden"); $("#login").classList.remove("hidden");
    return;
  }
  uid = user.uid;
  $("#who").textContent = user.displayName || user.email || "";
  $("#login").classList.add("hidden"); $("#main").classList.remove("hidden");
  unsub = onSnapshot(collection(db, "users", uid, "tasks"), (snap) => {
    tasks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    render();
  });
  focusInput();
});

/* ---------- 입력 ---------- */
const input = $("#addInput");
function focusInput() { setTimeout(() => input.focus(), 50); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && uid) focusInput(); });

input.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  let text = input.value.trim();
  if (!text || !uid) return;
  let effort = 0;
  const m = text.match(/\s*\/([123])\s*$/);
  if (m) { effort = Number(m[1]); text = text.slice(0, m.index).trim(); }
  if (!text) return;
  input.value = "";
  addDoc(collection(db, "users", uid, "tasks"), {
    title: text, effort, block: "inbox", done: false, createdAt: Date.now(), doneAt: null,
  });
});

/* ---------- 화면 그리기 ---------- */
function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime(); }

function render() {
  const today0 = startOfToday();
  const visible = tasks.filter((t) => !t.done || (t.doneAt && t.doneAt >= today0));

  // 진행도: 아침/점심/저녁에 배치된 것만
  const planned = visible.filter((t) => t.block !== "inbox");
  const doneN = planned.filter((t) => t.done).length;
  $("#progTxt").textContent = planned.length === 0
    ? "아침·점심·저녁에 오늘 할 일을 배치해 보세요"
    : (doneN === planned.length ? `🎉 오늘 계획 끝! (${doneN}/${planned.length})`
                                : `오늘 완료 ${doneN} / ${planned.length}`);
  $("#bar i").style.width = planned.length ? Math.round((doneN / planned.length) * 100) + "%" : "0";

  const root = $("#lists");
  root.textContent = "";
  for (const b of BLOCKS) {
    let items = visible.filter((t) => (t.block || "inbox") === b.id);
    if (filter) items = items.filter((t) => t.effort === filter);
    items.sort((a, z) => (a.done - z.done) || (a.createdAt - z.createdAt));

    const sec = document.createElement("div"); sec.className = "sec";
    const h = document.createElement("h2");
    const left = document.createElement("div"); left.textContent = b.label;
    const right = document.createElement("span");
    right.textContent = items.length ? `${items.filter((t) => t.done).length}/${items.length}` : "";
    h.append(left, right); sec.append(h);

    if (!items.length) {
      const em = document.createElement("div"); em.className = "empty";
      em.textContent = b.id === "inbox" ? "비어 있어요 ✨" : "비어 있음";
      sec.append(em);
    }
    for (const t of items) sec.append(taskRow(t));
    root.append(sec);
  }
}

function taskRow(t) {
  const row = document.createElement("div");
  row.className = "task" + (t.done ? " done" : "");
  row.dataset.id = t.id;

  const chk = document.createElement("button"); chk.className = "check"; chk.dataset.act = "check";
  chk.textContent = t.done ? "✓" : "";
  const title = document.createElement("span"); title.className = "title"; title.textContent = t.title;
  const dot = document.createElement("button"); dot.className = "dot e" + (t.effort || 0); dot.dataset.act = "dot";
  dot.setAttribute("aria-label", "부담도");
  const more = document.createElement("button"); more.className = "more"; more.dataset.act = "more"; more.textContent = "⋯";
  row.append(chk, title, dot, more);
  return row;
}

$("#lists").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const row = btn.closest(".task");
  const t = tasks.find((x) => x.id === row.dataset.id);
  if (!t) return;
  const ref = doc(db, "users", uid, "tasks", t.id);

  if (btn.dataset.act === "check") {
    const nowDone = !t.done;
    updateDoc(ref, { done: nowDone, doneAt: nowDone ? Date.now() : null });
    if (nowDone) {
      row.classList.add("pop");
      if (navigator.vibrate) navigator.vibrate(35);
      const r = btn.getBoundingClientRect();
      confetti(r.left + r.width / 2, r.top + r.height / 2, 26);
      const planned = tasks.filter((x) => x.block !== "inbox" && (!x.done || x.id === t.id));
      if (t.block !== "inbox" && planned.every((x) => x.done || x.id === t.id)) {
        setTimeout(() => confetti(innerWidth / 2, innerHeight / 3, 90), 250);
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
      }
    }
  } else if (btn.dataset.act === "dot") {
    updateDoc(ref, { effort: ((t.effort || 0) + 1) % 4 });
  } else if (btn.dataset.act === "more") {
    openSheet(t);
  }
});

$("#filters").addEventListener("click", (e) => {
  const c = e.target.closest(".chip"); if (!c) return;
  filter = Number(c.dataset.f);
  document.querySelectorAll(".chip").forEach((x) => x.classList.toggle("on", x === c));
  render();
});

/* ---------- 이동/삭제 시트 ---------- */
function openSheet(t) {
  sheetTask = t;
  const s = $("#sheet"); s.textContent = "";
  const title = document.createElement("div"); title.className = "t"; title.textContent = t.title; s.append(title);
  const opts = [
    ["morning", "🌅 아침으로"], ["noon", "☀️ 점심으로"], ["evening", "🌙 저녁으로"], ["inbox", "📥 Inbox로"],
    ["rename", "✏️ 이름 바꾸기"], ["delete", "🗑️ 삭제"],
  ];
  for (const [k, label] of opts) {
    const b = document.createElement("button"); b.textContent = label; b.dataset.k = k;
    if (k === "delete") b.className = "danger";
    s.append(b);
  }
  $("#scrim").classList.remove("hidden"); s.classList.remove("hidden");
}
function closeSheet() { $("#scrim").classList.add("hidden"); $("#sheet").classList.add("hidden"); sheetTask = null; }
$("#scrim").onclick = closeSheet;
$("#sheet").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-k]"); if (!b || !sheetTask) return;
  const t = sheetTask, k = b.dataset.k, ref = doc(db, "users", uid, "tasks", t.id);
  closeSheet();
  if (k === "delete") deleteDoc(ref);
  else if (k === "rename") {
    const n = prompt("새 이름", t.title);
    if (n && n.trim()) updateDoc(ref, { title: n.trim() });
  } else updateDoc(ref, { block: k });
});

/* ---------- 색종이 ---------- */
const cv = $("#conf"), cx = cv.getContext("2d");
function sizeCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
sizeCanvas(); addEventListener("resize", sizeCanvas);
let parts = [], running = false;
function confetti(x, y, n) {
  const colors = ["#34c759", "#ffbf00", "#ff4d42", "#4aa3ff", "#b36bff"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * (n > 40 ? 9 : 5);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, s: 4 + Math.random() * 4,
                 c: colors[(Math.random() * colors.length) | 0], life: 0, max: 45 + Math.random() * 25 });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  const k = devicePixelRatio;
  parts = parts.filter((p) => p.life < p.max);
  for (const p of parts) {
    p.life++; p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.vx *= 0.985;
    cx.globalAlpha = Math.max(0, 1 - p.life / p.max);
    cx.fillStyle = p.c; cx.fillRect(p.x * k, p.y * k, p.s * k, p.s * k);
  }
  cx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

/* ---------- PWA ---------- */
if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
</body>
</html>
